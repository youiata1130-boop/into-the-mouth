<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>口に入る デジタル試作</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const isBuiltIndex = location.pathname.replace(/\\/g, "/").endsWith("/dist/index.html");

      if (location.protocol === "file:" && !isBuiltIndex) {
        location.replace(new URL("./dist/index.html", location.href));
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
